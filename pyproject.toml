[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signaai"
version = "0.3.1"
description = "AI agent infrastructure on Signum blockchain — payments, identity, verifiable outputs, and trustless escrow"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["signum", "blockchain", "ai-agents", "payments", "escrow", "smart-contracts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# No external dependencies — uses only Python stdlib
dependencies = []

[project.scripts]
signaai-wallet    = "signaai.wallet:main"
signaai-identity  = "signaai.identity:main"
signaai-verify    = "signaai.verify:main"
signaai-escrow    = "signaai.escrow:main"
signaai-at        = "signaai.at_escrow:main"
signaai-arbitrate = "signaai.arbitration:main"
signaai-listen    = "signaai.listener:main"
signaai-events    = "signaai.events:main"
signaai-board     = "signaai.board:main"

[project.urls]
Homepage = "https://signaai.io"
Repository = "https://github.com/folkerds13/signaai"
Issues = "https://github.com/folkerds13/signaai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["signaai*"]

[tool.setuptools.package-data]
signaai = ["contracts/*.smart"]
